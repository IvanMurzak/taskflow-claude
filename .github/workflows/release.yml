name: Validate and release plugin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.5.0"
        required: true
        type: string
      title:
        description: "Optional release title"
        required: false
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Claude Code plugin validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code
      - name: Validate plugin
        run: claude plugin validate . --strict

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TITLE: ${{ inputs.title }}
        run: |
          if [ -n "$RELEASE_TITLE" ]; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TITLE" --generate-notes
          else
            gh release create "$RELEASE_TAG" --generate-notes
          fi
